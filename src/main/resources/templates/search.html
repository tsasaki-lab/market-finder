<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>検索結果</title>
</head>
<body>

<h1>検索結果</h1>

<p>検索キーワード:</p>

<h2 th:text="${keyword}"></h2>

<hr>

<h3>サンプル結果</h3>

<ul>
    <li th:each="result : ${results}">
        <a th:href="${result.url}" th:text="${result.fullName}" target="_blank"></a>
        <span th:text="' ★ ' + ${result.stars}"></span>
        <p th:text="${result.description}"></p>
    </li>
</ul>

<a href="/">戻る</a>

</body>
</html>
