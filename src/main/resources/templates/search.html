<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>検索結果 - Market Finder</title>
</head>
<body>

<h1>Market Finder</h1>

<p>
    検索キーワード:
    <strong th:text="${keyword}"></strong>
</p>
<p>
    言語:
    <strong th:text="${language == null || language.isBlank() ? '指定なし' : language}"></strong>
</p>

<a href="/">← トップへ戻る</a>

<hr>

<h2>GitHub検索結果</h2>
<div th:if="${validationMessage != null}"
     style="border: 1px solid #ffeeba; background: #fff3cd; padding: 12px; margin-bottom: 16px; border-radius: 8px;">
    <p th:text="${validationMessage}"></p>
</div>
<div th:if="${errorMessage != null}"
     style="border: 1px solid #f5c2c7; background: #f8d7da; padding: 12px; margin-bottom: 16px; border-radius: 8px;">
    <p th:text="${errorMessage}"></p>
</div>
<div th:if="${errorMessage == null and validationMessage == null and #lists.isEmpty(results)}">
    <p>検索結果がありません。</p>
</div>

<div th:if="${summary != null and errorMessage == null and validationMessage == null}"
     style="border: 1px solid #ddd; padding: 16px; margin-bottom: 16px; border-radius: 8px; background: #f8f9fa;">

    <h3>検索サマリー</h3>

    <p>
        件数:
        <strong th:text="${summary.resultCount}"></strong>
    </p>

    <p>
        平均Market Score:
        <strong th:text="${#numbers.formatDecimal(summary.averageMarketScore, 1, 1)}"></strong>
        / 100
    </p>

    <p>
        最高Market Score:
        <strong th:text="${summary.maxMarketScore}"></strong>
        / 100
    </p>

    <p>
        合計Stars:
        <strong th:text="${summary.totalStars}"></strong>
    </p>
</div>

<div th:each="result : ${results}"
     style="border: 1px solid #ddd; padding: 16px; margin-bottom: 16px; border-radius: 8px;">

    <h3>
        <a th:href="${result.url}"
           th:text="${result.fullName}"
           target="_blank">
        </a>
    </h3>

    <p th:text="${result.description}">
        description
    </p>

    <p>
        📈 Market Score:
        <strong th:text="${result.marketScore}"></strong>
        / 100
    </p>

    <ul>
        <li>
            Stars Score:
            <span th:text="${result.starsScore}"></span>
        </li>
        <li>
            Freshness Score:
            <span th:text="${result.freshnessScore}"></span>
        </li>
    </ul>
    <p>
        ⭐ Stars:
        <span th:text="${result.stars}"></span>
    </p>

    <p>
        🛠 Language:
        <span th:text="${result.language != null ? result.language : 'Unknown'}"></span>
    </p>

    <p>
        🕒 Updated:
        <span th:text="${result.updatedAt}"></span>
    </p>

    <a th:href="${result.url}" target="_blank">
        GitHubで開く
    </a>
</div>

</body>
</html>
