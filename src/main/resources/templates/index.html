<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Market Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Market Finder</span>
    </div>
</nav>

<main class="container py-5">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
        <h1 class="display-5 fw-bold">Market Finder</h1>
        <p class="fs-5 text-muted">
            GitHub上のリポジトリ情報から、技術テーマや市場ニーズのヒントを探します。
        </p>

        <form action="/search" method="get" class="row g-3 mt-4">
            <div class="col-md-5">
                <input type="text"
                       name="keyword"
                       class="form-control form-control-lg"
                       placeholder="例: spring boot"
                       required
                       maxlength="50">
            </div>

            <div class="col-md-3">
                <select name="language" class="form-select form-select-lg">
                    <option value="">指定なし</option>
                    <option value="Java">Java</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="Go">Go</option>
                </select>
            </div>

            <div class="col-md-3">
                <select name="sort" class="form-select form-select-lg">
                    <option value="stars">Stars順</option>
                    <option value="marketScore">Market Score順</option>
                    <option value="updated">更新日順</option>
                </select>
            </div>

            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    検索
                </button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
