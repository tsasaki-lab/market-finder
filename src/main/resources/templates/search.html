<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>検索結果 - Market Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Market Finder</a>
    </div>
</nav>

<main class="container py-4">

    <div class="bg-white rounded-3 shadow-sm p-4 mb-4">
        <h1 class="h3 mb-3">検索結果</h1>

        <form action="/search" method="get" class="row g-3">
            <div class="col-md-5">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       class="form-control"
                       placeholder="例: spring boot"
                       required
                       maxlength="50">
            </div>

            <div class="col-md-3">
                <select name="language" class="form-select">
                    <option value="" th:selected="${language == null || language.isBlank()}">指定なし</option>
                    <option value="Java" th:selected="${language == 'Java'}">Java</option>
                    <option value="JavaScript" th:selected="${language == 'JavaScript'}">JavaScript</option>
                    <option value="Python" th:selected="${language == 'Python'}">Python</option>
                    <option value="TypeScript" th:selected="${language == 'TypeScript'}">TypeScript</option>
                    <option value="Go" th:selected="${language == 'Go'}">Go</option>
                </select>
            </div>

            <div class="col-md-3">
                <select name="sort" class="form-select">
                    <option value="stars" th:selected="${sort == null || sort.isBlank() || sort == 'stars'}">Stars順</option>
                    <option value="marketScore" th:selected="${sort == 'marketScore'}">Market Score順</option>
                    <option value="updated" th:selected="${sort == 'updated'}">更新日順</option>
                </select>
            </div>

            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-primary">
                    検索
                </button>
            </div>
        </form>
    </div>

    <div th:if="${validationMessage != null}"
         class="alert alert-warning">
        <span th:text="${validationMessage}"></span>
    </div>

    <div th:if="${errorMessage != null}"
         class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${summary != null and errorMessage == null and validationMessage == null}"
         class="row g-3 mb-4">

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted">件数</div>
                    <div class="fs-4 fw-bold" th:text="${summary.resultCount}"></div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted">平均Market Score</div>
                    <div class="fs-4 fw-bold">
                        <span th:text="${#numbers.formatDecimal(summary.averageMarketScore, 1, 1)}"></span>
                        / 100
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted">最高Market Score</div>
                    <div class="fs-4 fw-bold">
                        <span th:text="${summary.maxMarketScore}"></span>
                        / 100
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted">合計Stars</div>
                    <div class="fs-4 fw-bold" th:text="${summary.totalStars}"></div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${errorMessage == null and validationMessage == null and #lists.isEmpty(results)}"
         class="alert alert-secondary">
        検索結果がありません。
    </div>

    <div class="row g-4">
        <div class="col-md-6" th:each="result : ${results}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h2 class="h5">
                        <a th:href="${result.url}"
                           th:text="${result.fullName}"
                           target="_blank"
                           class="text-decoration-none">
                        </a>
                    </h2>

                    <p class="text-muted" th:text="${result.description}">
                        description
                    </p>

                    <div class="mb-2">
                        <span class="badge bg-primary">
                            Market Score:
                            <span th:text="${result.marketScore}"></span>/100
                        </span>
                    </div>

                    <ul class="list-unstyled small mb-3">
                        <li>
                            ⭐ Stars:
                            <span th:text="${result.stars}"></span>
                        </li>
                        <li>
                            🛠 Language:
                            <span th:text="${result.language != null ? result.language : 'Unknown'}"></span>
                        </li>
                        <li>
                            🕒 Updated:
                            <span th:text="${result.updatedAt}"></span>
                        </li>
                        <li>
                            Stars Score:
                            <span th:text="${result.starsScore}"></span>
                        </li>
                        <li>
                            Freshness Score:
                            <span th:text="${result.freshnessScore}"></span>
                        </li>
                    </ul>

                    <a th:href="${result.url}"
                       target="_blank"
                       class="btn btn-outline-primary btn-sm">
                        GitHubで開く
                    </a>
                </div>
            </div>
        </div>
    </div>

</main>

</body>
</html>
