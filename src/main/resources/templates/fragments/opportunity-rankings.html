<div th:fragment="opportunityRankingsBlock"
     th:if="${opportunityRankings != null and !#lists.isEmpty(opportunityRankings)}"
     class="card shadow-sm mb-4 border-success">

    <div class="card-header bg-success text-white">
        Opportunity Ranking
    </div>

    <div class="card-body">

        <p class="text-muted">
            Opportunity Score と Competition Score を組み合わせて、SaaS機会の優先度を表示します。
        </p>

        <div class="table-responsive">
            <table class="table table-sm align-middle">
                <thead>
                <tr>
                    <th>Repository</th>
                    <th>Priority</th>
                    <th class="text-end">Ranking Score</th>
                    <th class="text-end">Opportunity Score</th>
                    <th class="text-end">Competition Score</th>
                    <th>Reason</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ranking : ${opportunityRankings}">
                    <td th:text="${ranking.title}">
                        Repository name
                    </td>

                    <td>
                        <span class="badge bg-success"
                              th:if="${ranking.priority == 'High'}"
                              th:text="${ranking.priority}">
                            High
                        </span>

                        <span class="badge bg-primary"
                              th:if="${ranking.priority == 'Medium'}"
                              th:text="${ranking.priority}">
                            Medium
                        </span>

                        <span class="badge bg-warning text-dark"
                              th:if="${ranking.priority == 'Low'}"
                              th:text="${ranking.priority}">
                            Low
                        </span>

                        <span class="badge bg-secondary"
                              th:if="${ranking.priority == 'Watch'}"
                              th:text="${ranking.priority}">
                            Watch
                        </span>
                    </td>

                    <td class="text-end"
                        th:text="${ranking.rankingScore} + ' / 100'">
                        80 / 100
                    </td>

                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(ranking.opportunityScore, 1, 1)}">
                        85.0
                    </td>

                    <td class="text-end"
                        th:text="${ranking.competitionScore}">
                        45
                    </td>

                    <td th:text="${ranking.reason}">
                        Reason
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
