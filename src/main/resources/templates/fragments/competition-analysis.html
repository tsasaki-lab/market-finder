<div th:fragment="competitionAnalysisBlock"
     th:if="${competitionAnalysis != null and competitionAnalysis.competitionScore > 0}"
     class="card shadow-sm mb-4 border-dark">

    <div class="card-header bg-dark text-white">
        Competition Analysis
    </div>

    <div class="card-body">

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="border rounded p-3 h-100">
                    <div class="text-muted small">Competition Score</div>
                    <div class="fs-4 fw-bold"
                         th:text="${competitionAnalysis.competitionScore} + ' / 100'">
                        82 / 100
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="border rounded p-3 h-100">
                    <div class="text-muted small">Competition Level</div>
                    <div class="fs-5 fw-bold"
                         th:text="${competitionAnalysis.competitionLevel}">
                        High
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="border rounded p-3 h-100">
                    <div class="text-muted small">Market Maturity</div>
                    <div class="fs-5 fw-bold"
                         th:text="${competitionAnalysis.marketMaturity}">
                        Mature
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="border rounded p-3 h-100">
                    <div class="text-muted small">Entry Difficulty</div>
                    <div class="fs-5 fw-bold"
                         th:text="${competitionAnalysis.entryDifficulty}">
                        High
                    </div>
                </div>
            </div>
        </div>

        <h5>Major Competitors</h5>

        <div class="table-responsive mb-4"
             th:if="${!#lists.isEmpty(competitionAnalysis.competitors)}">
            <table class="table table-sm align-middle">
                <thead>
                <tr>
                    <th>Repository</th>
                    <th>Language</th>
                    <th class="text-end">Stars</th>
                    <th class="text-end">Market Score</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="competitor : ${competitionAnalysis.competitors}">
                    <td>
                        <a th:href="${competitor.htmlUrl}"
                           th:text="${competitor.name}"
                           target="_blank"
                           rel="noopener noreferrer">
                            owner/repository
                        </a>
                        <div class="text-muted small"
                             th:text="${competitor.description}">
                            Repository description
                        </div>
                    </td>
                    <td th:text="${competitor.language}">Java</td>
                    <td class="text-end"
                        th:text="${#numbers.formatInteger(competitor.stars, 0, 'COMMA')}">
                        10,000
                    </td>
                    <td class="text-end"
                        th:text="${competitor.marketScore}">
                        85
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <h5>Differentiation Hints</h5>

        <ul class="mb-0"
            th:if="${!#lists.isEmpty(competitionAnalysis.differentiationHints)}">
            <li th:each="hint : ${competitionAnalysis.differentiationHints}"
                th:text="${hint}">
                AI機能を組み合わせる
            </li>
        </ul>

    </div>
</div>
