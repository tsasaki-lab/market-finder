<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Market Finder</title>
</head>
<body>

<h1>Market Finder</h1>

<p>GitHub上の人気リポジトリから、市場調査のヒントを探します。</p>

<form action="/search" method="get">
    <input type="text"
           name="keyword"
           placeholder="例: spring boot"
           required
           maxlength="50"
           style="width: 300px; padding: 8px;">

    <select name="language" style="padding: 8px;">
        <option value="">指定なし</option>
        <option value="Java">Java</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="TypeScript">TypeScript</option>
        <option value="Go">Go</option>
    </select>

    <select name="sort" style="padding: 8px;">
        <option value="stars">Stars順</option>
        <option value="marketScore">Market Score順</option>
        <option value="updated">更新日順</option>
    </select>

    <button type="submit" style="padding: 8px 16px;">
        検索
    </button>
</form>

</body>
</html>
